plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gameboost.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.gameboost.app"
        minSdk 24          // Android 7.0 (syarat library Shizuku), masih mencakup HP lama
        targetSdk 35       // Android 15 (juga berjalan di Android 16 dan HyperOS)
        versionCode 3
        versionName "3.0"
    }

    buildFeatures {
        aidl true          // untuk layanan shell Shizuku
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Shizuku: hak shell/root tanpa perlu root penuh. Hanya dipakai jika pengguna menyalakannya.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
