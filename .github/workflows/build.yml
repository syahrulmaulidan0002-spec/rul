name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBoost-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan APK ke halaman Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GameBoost.apk
          gh release delete latest --yes --cleanup-tag || true
          sleep 5
          gh release create latest GameBoost.apk --latest --draft=false \
            --title "GameBoost (terbaru)" \
            --notes "APK terbaru hasil build otomatis. Unduh GameBoost.apk lalu pasang di HP." \
            --target "${{ github.sha }}"
          # Pastikan rilis benar-benar terbit (bukan draft) supaya tautan unduhan bisa dibuka.
          gh release edit latest --draft=false --latest
